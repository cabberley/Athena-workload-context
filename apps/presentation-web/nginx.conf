worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  gzip off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-store";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), display-capture=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    location = /healthz {
      default_type text/plain;
      return 200 "healthy\n";
    }

    location = /runtime-manifest.json {
      proxy_pass http://127.0.0.1:8081/runtime-manifest.json;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host "presentation-asset-gateway";
      proxy_redirect off;
      proxy_buffering off;
    }

    location ^~ /live/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host "presentation-asset-gateway";
      proxy_redirect off;
      proxy_buffering off;
    }

    location ~* \.json$ {
      types {
        application/json json;
      }
      default_type application/json;
      error_page 404 =404 /json-not-found.json;
      try_files $uri =404;
    }

    location = /json-not-found.json {
      internal;
      types {
        application/json json;
      }
      default_type application/json;
    }

    location /assets/ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}