name: Start reviewed WC-013 evidence collector

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Reviewed operational phase collector to start
        required: true
        type: choice
        options:
          - baseline
          - faulted
          - recovered

permissions:
  contents: read

concurrency:
  group: wc013-collector-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  start-reviewed-collector:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: athena-live
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.WC013_COLLECTOR_CONTROLLER_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sign in as the deployment-owned controller identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the federated Azure CLI identity
        shell: bash
        run: |
          set -euo pipefail
          actual_client_id="$(az account show --query user.name --output tsv)"
          if [[ "${actual_client_id,,}" != "${AZURE_CLIENT_ID,,}" ]]; then
            echo 'Azure CLI is not authenticated as the reviewed collector controller identity.' >&2
            exit 1
          fi

      - name: Install the repository controller
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install exact checked-out package
        run: python -m pip install .

      - name: Load one reviewed deployment-output contract
        id: contract
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          CONTRACT_PATH: ${{ runner.temp }}/wc013-collector-start-contract.json
        run: |
          set -euo pipefail
          case "$PHASE" in
            baseline) contract_index=1 ;;
            faulted) contract_index=2 ;;
            recovered) contract_index=3 ;;
            *) echo 'Unreviewed phase.' >&2; exit 1 ;;
          esac
          az deployment sub show \
            --name wc013-ready \
            --query "properties.outputs.evidenceCollectorStartContracts.value[$contract_index]" \
            --output json \
          | python -c 'import json, os, pathlib, sys; phase=os.environ["PHASE"]; value=json.load(sys.stdin); expected=f"-op-{phase}-collector"; job=value.get("jobResourceId", "") if isinstance(value, dict) else ""; job.endswith(expected) or sys.exit("Deployment output did not contain the selected reviewed collector contract."); pathlib.Path(os.environ["CONTRACT_PATH"]).write_text(json.dumps(value, separators=(",", ":"), sort_keys=True), encoding="utf-8")'
          echo "path=$CONTRACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate and start the exact reviewed collector
        run: >-
          athena-context wc013-collector-controller
          --contract '${{ steps.contract.outputs.path }}'
          --controller-identity-client-id '${{ env.AZURE_CLIENT_ID }}'
          --use-azure-cli-credential