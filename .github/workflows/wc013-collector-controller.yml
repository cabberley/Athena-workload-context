name: Start reviewed WC-013 evidence collector

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Reviewed operational phase collector to start
        required: true
        type: choice
        options:
          - baseline
          - faulted
          - recovered
      deployment:
        description: Immutable reviewed deployment contract
        required: true
        type: choice
        options:
          - pending-review-no-deployment

permissions:
  contents: read

concurrency:
  group: wc013-collector-${{ inputs.deployment }}-${{ inputs.phase }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  start-reviewed-collector:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: athena-live
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.WC013_COLLECTOR_CONTROLLER_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      CONTRACT_PATH: ${{ runner.temp }}/wc013-collector-start-contract.json
    steps:
      - name: Check out the immutable dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the immutable checkout
        shell: bash
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -z "$(git status --porcelain)"

      - name: Install the immutable repository controller
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install exact checked-out package
        run: python -m pip install .

      - name: Select the immutable reviewed deployment contract
        shell: bash
        env:
          DEPLOYMENT_SELECTION: ${{ inputs.deployment }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_SELECTION" == 'pending-review-no-deployment' ]]; then
            echo 'No immutable reviewed deployment contract is enabled.' >&2
            exit 1
          fi
          python -m athena_context.wc013_reviewed_collector_contract \
            --index infra/wc013-live-acceptance/reviewed-collector-contracts/index.json \
            --deployment "$DEPLOYMENT_SELECTION" \
            --phase "$PHASE" \
            --output "$CONTRACT_PATH"

      - name: Sign in as the deployment-owned controller identity
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the federated Azure CLI identity
        shell: bash
        run: |
          set -euo pipefail
          actual_client_id="$(az account show --query user.name --output tsv)"
          if [[ "${actual_client_id,,}" != "${AZURE_CLIENT_ID,,}" ]]; then
            echo 'Azure CLI is not authenticated as the reviewed collector controller identity.' >&2
            exit 1
          fi

      - name: Validate and start the exact reviewed collector
        run: >-
          athena-context wc013-collector-controller
          --contract "$CONTRACT_PATH"
          --controller-identity-client-id "$AZURE_CLIENT_ID"
          --use-azure-cli-credential
