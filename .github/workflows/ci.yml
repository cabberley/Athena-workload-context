name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Verify deterministic presentation assets
        run: python scripts/generate_presentation_web_assets.py --check
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
      - name: Test immutable controller container
        shell: pwsh
        run: ./test-controller-container.ps1

  context-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high

  presentation-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/presentation-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/presentation-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test production container
        shell: pwsh
        run: ./test-container.ps1
      - name: Audit
        run: npm audit --audit-level=high
